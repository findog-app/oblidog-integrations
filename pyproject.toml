[project]
name = "oblidog-integrations"
version = "0.1.0"
description = "Batch and one-shot integrations for Oblidog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "findog-client-python @ git+https://github.com/oblidog/oblidog-client-python.git",
  "pydantic>=2.0",
  "structlog>=25.0",
]

[project.scripts]
oblidog-integrations = "oblidog_integrations.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/oblidog_integrations"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "ekartoteka_e2e: read-only tests against the live e-Kartoteka API",
]
