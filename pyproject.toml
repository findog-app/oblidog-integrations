[project]
name = "oblidog-integrations"
version = "0.1.0"
description = "Batch and one-shot integrations for Oblidog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "findog-client-python @ git+https://github.com/findog-app/findog-client-python.git",
]

[project.scripts]
oblidog-integrations = "oblidog_integrations.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oblidog_integrations"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
