services:
  nju-account-one:
    image: ghcr.io/oblidog/oblidog-integrations:${OBLIDOG_INTEGRATIONS_VERSION:?Set an immutable release tag in .env}
    entrypoint: ["/usr/local/bin/oblidog-scheduled-run"]
    command: ["nju"]
    env_file:
      - .env.nju.account-one
    restart: "no"
    volumes:
      - nju-account-one-state:/home/app/.local/state/oblidog-integrations

  nju-account-one-scheduler:
    image: ghcr.io/oblidog/oblidog-integrations:${OBLIDOG_INTEGRATIONS_VERSION:?Set an immutable release tag in .env}
    entrypoint: ["/usr/local/bin/oblidog-scheduler"]
    command: ["nju"]
    env_file:
      - .env.nju.account-one
    environment:
      OBLIDOG_SCHEDULER_CRON: ${NJU_ACCOUNT_ONE_CRON:-0 9 * * *}
      OBLIDOG_SCHEDULER_TIMEZONE: ${OBLIDOG_SCHEDULER_TIMEZONE:-Europe/Warsaw}
    restart: unless-stopped
    volumes:
      - nju-account-one-state:/home/app/.local/state/oblidog-integrations

  nju-account-two:
    image: ghcr.io/oblidog/oblidog-integrations:${OBLIDOG_INTEGRATIONS_VERSION:?Set an immutable release tag in .env}
    entrypoint: ["/usr/local/bin/oblidog-scheduled-run"]
    command: ["nju"]
    env_file:
      - .env.nju.account-two
    restart: "no"
    volumes:
      - nju-account-two-state:/home/app/.local/state/oblidog-integrations

  nju-account-two-scheduler:
    image: ghcr.io/oblidog/oblidog-integrations:${OBLIDOG_INTEGRATIONS_VERSION:?Set an immutable release tag in .env}
    entrypoint: ["/usr/local/bin/oblidog-scheduler"]
    command: ["nju"]
    env_file:
      - .env.nju.account-two
    environment:
      OBLIDOG_SCHEDULER_CRON: ${NJU_ACCOUNT_TWO_CRON:-0 9 * * *}
      OBLIDOG_SCHEDULER_TIMEZONE: ${OBLIDOG_SCHEDULER_TIMEZONE:-Europe/Warsaw}
    restart: unless-stopped
    volumes:
      - nju-account-two-state:/home/app/.local/state/oblidog-integrations

volumes:
  nju-account-one-state:
  nju-account-two-state:
